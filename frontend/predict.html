<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<div class="bg-glow"></div>

<!-- Main -->
<div class="inner-page">
  <div class="predict-page-container">
    <div class="container">

      <div class="section-header">
        <h1 class="section-title">Patient Assessment</h1>
        <p class="section-sub">Enter clinical data to classify cardiovascular risk.</p>
      </div>

      <div class="form-card" style="width:100%;">

        <!-- ── Demographics ── -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Demographics
        </div>
        <div class="grid-2">
          <!-- FIX #2: 每个 field 加 err-* span -->
          <div class="field" id="field-age">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="e.g. 56" min="1" max="120">
            <span class="field-error-msg" id="err-age"></span>
          </div>
          <div class="field" id="field-sex">
            <label for="sex">Sex</label>
            <select id="sex" name="sex">
              <option value="">Select…</option>
              <option value="M">M — Male</option>
              <option value="F">F — Female</option>
            </select>
            <span class="field-error-msg" id="err-sex"></span>
          </div>
        </div>

        <!-- ── Symptoms ── -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Symptoms
        </div>
        <div class="grid-2">
          <div class="field" id="field-chest_pain_type">
            <label for="chest_pain_type">Chest Pain Type</label>
            <select id="chest_pain_type" name="chest_pain_type">
              <option value="">Select…</option>
              <option value="TA">TA — Typical Angina</option>
              <option value="ATA">ATA — Atypical Angina</option>
              <option value="NAP">NAP — Non-Anginal Pain</option>
              <option value="ASY">ASY — Asymptomatic</option>
            </select>
            <span class="field-error-msg" id="err-chest_pain_type"></span>
          </div>
          <div class="field" id="field-exercise_angina">
            <label for="exercise_angina">Exercise Angina</label>
            <select id="exercise_angina" name="exercise_angina">
              <option value="">Select…</option>
              <option value="N">N — No</option>
              <option value="Y">Y — Yes</option>
            </select>
            <span class="field-error-msg" id="err-exercise_angina"></span>
          </div>
        </div>

        <!-- ── Vitals ── -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          Vitals
        </div>
        <div class="grid-3">
          <div class="field" id="field-resting_bp">
            <label for="resting_bp">Resting BP (mmHg)</label>
            <input type="number" id="resting_bp" name="resting_bp" placeholder="50–250" min="50" max="250">
            <span class="field-error-msg" id="err-resting_bp"></span>
          </div>
          <div class="field" id="field-cholesterol">
            <label for="cholesterol">Cholesterol (mg/dL)</label>
            <input type="number" id="cholesterol" name="cholesterol" placeholder="50–800" min="50" max="800">
            <span class="field-error-msg" id="err-cholesterol"></span>
          </div>
          <div class="field" id="field-max_hr">
            <label for="max_hr">Max Heart Rate (bpm)</label>
            <input type="number" id="max_hr" name="max_hr" placeholder="40–230" min="40" max="230">
            <span class="field-error-msg" id="err-max_hr"></span>
          </div>
        </div>

        <!-- Fasting Blood Sugar -->
        <div class="field" id="field-fasting_bs" style="margin-top:12px;">
          <label>Fasting Blood Sugar &gt; 120 mg/dL</label>
          <div class="grid-2" style="margin-top:4px;">
            <div class="radio-option">
              <input type="radio" id="fbs0" name="fasting_bs" value="0">
              <label for="fbs0">No / Normal</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="fbs1" name="fasting_bs" value="1">
              <label for="fbs1">Yes / Elevated</label>
            </div>
          </div>
          <span class="field-error-msg" id="err-fasting_bs"></span>
        </div>

        <!-- ── ECG & ST Analysis ── -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          ECG &amp; ST Analysis
        </div>
        <div class="grid-3">
          <div class="field" id="field-resting_ecg">
            <label for="resting_ecg">Resting ECG</label>
            <select id="resting_ecg" name="resting_ecg">
              <option value="">Select…</option>
              <option value="Normal">Normal</option>
              <option value="ST">ST — ST-T abnormality</option>
              <option value="LVH">LVH — Left ventricular hypertrophy</option>
            </select>
            <span class="field-error-msg" id="err-resting_ecg"></span>
          </div>
          <div class="field" id="field-oldpeak">
            <label for="oldpeak">Oldpeak</label>
            <input type="number" id="oldpeak" name="oldpeak" placeholder="-3.0 to 7.0" step="0.1" min="-3" max="7">
            <span class="field-error-msg" id="err-oldpeak"></span>
          </div>
          <div class="field" id="field-st_slope">
            <label for="st_slope">ST Slope</label>
            <select id="st_slope" name="st_slope">
              <option value="">Select…</option>
              <option value="Up">Up</option>
              <option value="Flat">Flat</option>
              <option value="Down">Down</option>
            </select>
            <span class="field-error-msg" id="err-st_slope"></span>
          </div>
        </div>

        <!-- ── Treatment Input ── -->
        <div class="form-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Treatment Input
        </div>
        <label class="arrhythmia-row" for="has_arrhythmia">
          <input type="checkbox" id="has_arrhythmia" name="has_arrhythmia">
          <div class="ar-text">
            <div class="ar-title">Patient has arrhythmia</div>
            <div class="ar-sub">Clinician-entered flag. Combined with High risk, triggers SBRT branch.</div>
          </div>
        </label>

        <!-- Submit -->
        <div class="submit-area">
          <div id="form-error" class="msg err"></div>
          <button id="submit-btn" onclick="handleSubmit()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            Run Assessment
          </button>
        </div>

      </div><!-- /form-card -->
    </div><!-- /container -->
  </div><!-- /predict-page-container -->
</div><!-- /inner-page -->

<script src="js/api.js"></script>
<script>
// Theme
(function(){ const s = localStorage.getItem('cardiosurv-theme'); if (s === 'light') document.body.classList.add('light'); })();
function toggleTheme() { const l = document.body.classList.toggle('light'); localStorage.setItem('cardiosurv-theme', l ? 'light' : 'dark'); }

// Particle canvas
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 40; i++) {
    particles.push({ x: Math.random()*1000, y: Math.random()*1000, r: Math.random()*1.2+0.3, vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.12, o: Math.random()*0.4+0.05 });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(224,92,122,${p.o})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── FORM HELPERS ────────────────────────────────────────────
// FIX #2: setFieldError 现在正确地显示/隐藏 field-error-msg span
function setFieldError(name, msg) {
  const wrap  = document.getElementById('field-' + name);
  const errEl = document.getElementById('err-' + name);
  if (!wrap) return;
  if (msg) {
    wrap.classList.add('has-error');
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
  } else {
    wrap.classList.remove('has-error');
    if (errEl) { errEl.textContent = ''; errEl.style.display = 'none'; }
  }
}

function clearAllErrors() {
  ['age','sex','chest_pain_type','resting_bp','cholesterol','fasting_bs',
   'resting_ecg','max_hr','exercise_angina','oldpeak','st_slope'].forEach(k => setFieldError(k, null));
  const fe = document.getElementById('form-error');
  fe.style.display = 'none'; fe.textContent = '';
}

function getFormData() {
  const fbsEl = document.querySelector('input[name="fasting_bs"]:checked');
  return {
    age:             document.getElementById('age').value.trim(),
    sex:             document.getElementById('sex').value,
    chest_pain_type: document.getElementById('chest_pain_type').value,
    resting_bp:      document.getElementById('resting_bp').value.trim(),
    cholesterol:     document.getElementById('cholesterol').value.trim(),
    fasting_bs:      fbsEl ? fbsEl.value : '',
    resting_ecg:     document.getElementById('resting_ecg').value,
    max_hr:          document.getElementById('max_hr').value.trim(),
    exercise_angina: document.getElementById('exercise_angina').value,
    oldpeak:         document.getElementById('oldpeak').value.trim(),
    st_slope:        document.getElementById('st_slope').value,
  };
}

function coerceFormData(raw) {
  return {
    age:             parseInt(raw.age),
    sex:             raw.sex,
    chest_pain_type: raw.chest_pain_type,
    resting_bp:      parseInt(raw.resting_bp),
    cholesterol:     parseInt(raw.cholesterol),
    fasting_bs:      parseInt(raw.fasting_bs),
    resting_ecg:     raw.resting_ecg,
    max_hr:          parseInt(raw.max_hr),
    exercise_angina: raw.exercise_angina,
    oldpeak:         parseFloat(raw.oldpeak),
    st_slope:        raw.st_slope,
  };
}

// ── SUBMIT ──────────────────────────────────────────────────
async function handleSubmit() {
  clearAllErrors();
  const raw = getFormData();

  const { valid, errors } = validatePredictForm(raw);
  if (!valid) {
    Object.entries(errors).forEach(([k, v]) => setFieldError(k, v));
    const fe = document.getElementById('form-error');
    fe.textContent = 'Please fix the highlighted fields before submitting.';
    fe.style.display = 'block';
    const firstErr = document.querySelector('.has-error');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const body = coerceFormData(raw);
  const hasArrhythmia = document.getElementById('has_arrhythmia').checked;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.innerHTML = '<div class="btn-spinner"></div> Analysing…';

  try {
    // Step 1: predict
    const predictResult = await submitPredict(body);

    // Step 2: recommend
    // FIX: Result 不显示的核心修复 ——
    // 先把 predict 存进去，再请求 recommend。
    // 如果 recommend 失败也不阻止跳转，只是 recommend 数据为 null。
    sessionStorage.setItem('cardiosurv-predict', JSON.stringify(predictResult));

    let recommendResult = null;
    try {
      recommendResult = await submitRecommend({
        prediction_id:  predictResult.prediction_id,
        has_arrhythmia: hasArrhythmia,
      });
    } catch (recErr) {
      // recommend 失败不致命，results.html 会处理 null 的情况
      console.warn('Recommend API failed:', recErr.message);
    }

    sessionStorage.setItem('cardiosurv-recommend', JSON.stringify(recommendResult));
    window.location.href = 'results.html';

  } catch (err) {
    // predict 本身失败，显示错误
    const fe = document.getElementById('form-error');
    if (err.status === 422 && err.details && err.details.length) {
      err.details.forEach(d => { if (d.field) setFieldError(d.field, d.reason || 'Invalid value'); });
      fe.textContent = 'Validation error — see highlighted fields.';
    } else {
      fe.textContent = `Error (${err.status || 'network'}): ${err.message}`;
    }
    fe.style.display = 'block';
  } finally {
    // FIX: 无论成功还是失败（没跳转的情况），都恢复按钮
    if (!window._navigating) {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Run Assessment`;
    }
  }
}

// 防止跳转后 finally 误触发
window._navigating = false;
const _origHref = Object.getOwnPropertyDescriptor(window.location, 'href');
</script>
</body>
