
# Render Blueprint — CardioSurv (API + Frontend + Database)
# Apply this file via Render Dashboard → "New +" → "Blueprint" → connect repo.
#
# Provisions:
#   1) cardiosurv-api          — FastAPI web service (backend)
#   2) cardiosurv-frontend     — Static Site (HTML/CSS/JS)
#   3) cardiosurv-db           — PostgreSQL free tier (90-day expiry, then recreate)
#
# After first apply, the DB tables still need to be created — see
# docs/deployment.md §"Initial DB setup".

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: cardiosurv-api
    runtime: python
    plan: free
    region: singapore        # closest free region for Malaysia/Asia team
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DIR
        value: ./models
      - key: PART1_MODEL_PATH
        value: models/part1_classifier_v1.0.pkl
      - key: PART2_MODEL_PATH
        value: models/part2_recommender_v1.0.pkl
      - key: SURVIVAL_MODEL_PATH
        value: models/survival_cox_v1.0.pkl
      - key: FEATURES_CSV
        value: data/processed/features.csv
      # CORS — "*" during testing, tighten later to the frontend URL.
      - key: CORS_ORIGINS
        value: "*"
      # Database URL auto-injected from the PostgreSQL service below.
      - key: DATABASE_URL
        fromDatabase:
          name: cardiosurv-db
          property: connectionString

  # ── Frontend Static Site ────────────────────────────────────────────────────
  - type: web
    name: cardiosurv-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA-style fallback: any unknown path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cardiosurv-db
    plan: free
    region: singapore
    databaseName: cardiosurv
    user: cardiosurv
